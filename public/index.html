<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Доска задач — упрощённая версия</title>
  <style>
    :root { color-scheme: light; --ink: #29332d; --muted: #737a72; --line: #dddfd6; --green: #365b43; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f6f5f0; color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { max-width: 1180px; margin: 0 auto; padding: 48px 32px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; transition: background .15s, border-color .15s; }
    button:disabled { cursor: wait; opacity: .6; }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }
    button, input, select, textarea { border-radius: 6px; }
    h1 { font-size: 32px; font-weight: 600; letter-spacing: -1px; line-height: 1.2; margin: 0 0 10px; }
    header { margin-bottom: 24px; }
    #form { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 16px 0 24px; }
    #form-label { width: 100%; font-size: 12px; font-weight: 600; color: #59655b; }
    input, select { border: 1px solid var(--line); background: #fff; color: var(--ink); padding: 10px 12px; min-width: 0; }
    input::placeholder, textarea::placeholder { color: #94998f; }
    #title { flex: 1; }
    #status { width: 175px; }
    .primary { border: 1px solid var(--green); background: var(--green); color: #fff; padding: 10px 17px; font-weight: 500; }
    .primary:hover { background: #294834; border-color: #294834; }
    .secondary { padding: 10px 14px; border: 1px solid var(--line); background: transparent; color: var(--muted); }
    .secondary:hover { background: #eeeee7; }
    #error { color: #a54235; font-size: 13px; margin: 0 0 16px; }
    #error:empty { display: none; }
    #board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
    .column { background: #edeFE7; border: 1px solid #e3e5dc; border-radius: 9px; padding: 16px; min-height: 320px; }
    .column h2 { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; margin: 0 0 18px; }
    .column h2::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #8c9588; }
    .column.doing h2::before { background: #bd9346; }
    .column.done h2::before { background: #558566; }
    .column.done { background: #eaf0e7; border-color: #dde6d9; }
    article { padding: 16px; margin-bottom: 10px; background: #fff; border: 1px solid #dfe3d9; border-radius: 7px; box-shadow: 0 1px 2px #29332d04; }
    article p { margin: 0 0 20px; font-size: 15px; font-weight: 500; line-height: 1.5; overflow-wrap: anywhere; white-space: pre-wrap; }
    .card-actions { display: flex; gap: 18px; padding-top: 10px; border-top: 1px solid #f0f1ec; }
    .card-actions button { background: transparent; border: 0; padding: 4px 0; min-height: 28px; color: #6c786d; font-size: 12px; }
    .card-actions button:hover { color: var(--green); text-decoration: underline; text-underline-offset: 3px; }
    .card-actions .delete:hover { color: #a54235; }
    .empty { color: #92998e; font-size: 12px; padding: 20px 0; text-align: center; }
    .assistant { margin: 36px auto 0; max-width: 760px; }
    .assistant-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .assistant-heading label { font-size: 14px; font-weight: 600; }
    .provider { color: var(--muted); font-size: 11px; }
    .composer { border: 1px solid #cdd4c6; background: #fff; border-radius: 10px; padding: 16px; transition: border-color .15s, box-shadow .15s; }
    .composer:focus-within { border-color: #81967b; box-shadow: 0 0 0 3px #365b4309; }
    #command { display: block; border: 0; border-radius: 0; background: transparent; color: var(--ink); width: 100%; height: 84px; min-height: 84px; max-height: 220px; padding: 0; resize: vertical; line-height: 1.65; }
    #command:focus { outline: none; }
    .composer-footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
    .shortcut { color: #858d81; font-size: 11px; }
    kbd { font: inherit; padding: 2px 4px; border: 1px solid #e5e8df; border-radius: 3px; }
    #send { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 13px; padding: 9px 14px; }
    #send svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    #reply { margin: 12px 0 0; background: #eeefe8; border-left: 2px solid #a8b79f; border-radius: 0 5px 5px 0; padding: 12px 14px; color: #596752; font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
    #reply:empty { display: none; }
    #reply[data-state="error"] { background: #f7ede7; color: #a54235; border-color: #c99b8a; }
    [hidden] { display: none !important; }
    @media (max-width: 700px) {
      main { padding: 30px 18px; }
      header { margin-bottom: 18px; }
      h1 { font-size: 28px; }
      #board { grid-template-columns: 1fr; gap: 14px; }
      .column { min-height: 160px; }
      #title { flex-basis: 100%; }
      #status { flex: 1; width: auto; }
      .assistant { margin-top: 28px; }
    }
    @media (max-width: 380px) { .shortcut { font-size: 10px; } .composer { padding: 12px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Доска задач</h1>
    </header>

    <form id="form">
      <label for="title" id="form-label">Новая задача</label>
      <input id="title" placeholder="Что нужно сделать?" aria-label="Название задачи" maxlength="100" required>
      <select id="status" aria-label="Статус задачи">
        <option value="todo">Нужно сделать</option>
        <option value="doing">В работе</option>
        <option value="done">Готово</option>
      </select>
      <button id="save" class="primary">Добавить</button>
      <button id="cancel" class="secondary" type="button" hidden>Отмена</button>
    </form>
    <p id="error" role="alert"></p>

    <div id="board">
      <section class="column" aria-labelledby="todo-heading"><h2 id="todo-heading">Нужно сделать</h2><div id="todo"></div></section>
      <section class="column doing" aria-labelledby="doing-heading"><h2 id="doing-heading">В работе</h2><div id="doing"></div></section>
      <section class="column done" aria-labelledby="done-heading"><h2 id="done-heading">Готово</h2><div id="done"></div></section>
    </div>

    <section class="assistant" aria-label="Управление доской через Gemini">
      <form id="chat-form">
        <div class="assistant-heading">
          <label for="command">Команда для доски</label>
          <span class="provider">Gemini</span>
        </div>
        <div class="composer">
          <textarea id="command" placeholder="Например: перемести «Выучить JavaScript» в работу" aria-label="Команда для Gemini" maxlength="1000" rows="3" required></textarea>
          <div class="composer-footer">
            <span class="shortcut" id="command-hint"><kbd>Ctrl</kbd> + <kbd>Enter</kbd> — отправить</span>
            <button id="send" class="primary" type="submit"><span id="send-label">Выполнить</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5"/></svg></button>
          </div>
        </div>
      </form>
      <p id="reply" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script type="module" src="/app.js"></script>
</body>
</html>
